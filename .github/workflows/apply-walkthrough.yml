name: Publish tested walkthrough evidence

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-walkthrough.yml

permissions:
  contents: write

concurrency:
  group: publish-pawton-walkthrough-dev
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PATCH_SHA256: ec685d2f3f575f08a44b6819d5b4d2040a81e98a83d68ecb9dae14cd87632c1a
      EXPECTED_TREE: 59ed45c9a798a4db8c1f3d83c1e9840c14b22773
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/pawton-manufacturing/package-lock.json

      - name: Apply the exact locally tested patch
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          const encoded = ['01', '02', '03', '04'].map(part =>
            fs.readFileSync(`.github/patches/walkthrough-feature.${part}.br.b64`, 'utf8')).join('');
          const patch = brotliDecompressSync(Buffer.from(encoded, 'base64'));
          if (createHash('sha256').update(patch).digest('hex') !== process.env.PATCH_SHA256)
            throw new Error('Publication patch integrity check failed.');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'walkthrough.patch'), patch);
          NODE
          git apply --check "$RUNNER_TEMP/walkthrough.patch"
          git apply --index "$RUNNER_TEMP/walkthrough.patch"

      - name: Verify the source before publication
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --prefix apps/pawton-manufacturing --no-audit --no-fund
          npm test --prefix apps/pawton-manufacturing
          npm run build --prefix apps/pawton-manufacturing
          bash scripts/test.sh --skip-azure

      - name: Publish only the verified source and remove transport helpers
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm -- .github/workflows/apply-walkthrough.yml .github/patches/walkthrough-feature.01.br.b64 .github/patches/walkthrough-feature.02.br.b64 .github/patches/walkthrough-feature.03.br.b64 .github/patches/walkthrough-feature.04.br.b64
          if [[ "$(git write-tree)" != "$EXPECTED_TREE" ]]; then
            echo "::error::The source tree differs from the scoped, locally verified publication."
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: show actual SQL and Defender walkthrough evidence' -m 'Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>'
          git push origin HEAD:dev
          rsync -a --exclude=node_modules --exclude=dist --exclude=.astro apps/pawton-manufacturing/ "$RUNNER_TEMP/pawton-walkthrough/"

      - name: Package source for authorized Azure OneDeploy
        uses: actions/upload-artifact@v4
        with:
          name: pawton-walkthrough-source
          path: ${{ runner.temp }}/pawton-walkthrough/
          retention-days: 1
          if-no-files-found: error
