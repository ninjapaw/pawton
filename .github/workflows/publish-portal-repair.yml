name: Publish Pawton portal repair

on:
  push:
    branches: [dev]
    paths: [.github/workflows/publish-portal-repair.yml]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-pawton-portal-dev
  cancel-in-progress: false

jobs:
  portal:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: NP-ninjapaws-dojo-sql-Dev-CentralUS
      WEB_APP_NAME: ninjapaws-pawton-dev
    steps:
      - name: Checkout verified portal source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Azure login using existing environment OIDC
        uses: azure/login@v2
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Restore previous deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          source="$(az webapp deployment source show --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$RESOURCE_GROUP" --name "$WEB_APP_NAME" --query repoUrl -o tsv)"
          if [[ -n "$source" && "$source" != None ]]; then
            branch="$(az webapp deployment source show --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$RESOURCE_GROUP" --name "$WEB_APP_NAME" --query branch -o tsv)"
            if [[ "$source" != https://github.com/ninjapaw/pawton || "$branch" != dev ]]; then
              echo "::error::Unexpected repository configuration; refusing to remove it."
              exit 1
            fi
            az webapp deployment source delete --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$RESOURCE_GROUP" --name "$WEB_APP_NAME" --only-show-errors
          fi

      - name: ZIP deploy the portal without reprovisioning SQL
        shell: bash
        run: |
          set -Eeuo pipefail
          package="$RUNNER_TEMP/pawton-portal-repair.zip"
          (cd apps/pawton-manufacturing && zip -rq "$package" . -x 'node_modules/*' -x 'dist/*' -x '.astro/*')
          az webapp deploy --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$RESOURCE_GROUP" --name "$WEB_APP_NAME" --src-path "$package" --type zip --async false --timeout 900000 --only-show-errors --output none

      - name: Verify the live GitHub link and SQL connection
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in {1..20}; do
            if health="$(curl --fail --show-error --silent --max-time 30 https://pawton.ninjapaws.org/health)" &&
              page="$(curl --fail --show-error --silent --max-time 30 https://pawton.ninjapaws.org/login)"; then
              if jq -e '.status == "healthy" and .database == "connected"' <<< "$health" >/dev/null &&
                grep -Fq '<a href="https://github.com/ninjapaw/pawton" target="_blank" rel="noopener noreferrer">GitHub source</a>' <<< "$page"; then
                echo "Verified deployed GitHub source link and healthy SQL connection."
                exit 0
              fi
            fi
            echo "Live verification attempt $attempt/20 is not ready."
            if [[ "$attempt" -lt 20 ]]; then sleep 15; fi
          done
          echo "::error::The live portal did not pass the GitHub footer and SQL connectivity checks."
          exit 1
