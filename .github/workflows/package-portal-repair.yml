name: Package Pawton portal repair

on:
  push:
    branches: [dev]
    paths: [.github/workflows/package-portal-repair.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout verified portal source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Package the portal for direct Azure deployment
        uses: actions/upload-artifact@v4
        with:
          name: pawton-portal-repair
          path: apps/pawton-manufacturing/
          retention-days: 1
          if-no-files-found: error
