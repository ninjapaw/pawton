name: Validate deployment assets

on:
  pull_request:
    paths:
      - "infra/**"
      - "scripts/**"
      - "apps/pawton-manufacturing/**"
      - "config/**"
      - "vendor/pawprint-dns/**"
      - "vendor/pawprint-dns.manifest.json"
      - "package*.json"
      - ".node-version"
      - ".github/workflows/**"
      - "azuredeploy.json"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "scripts/**"
      - "apps/pawton-manufacturing/**"
      - "config/**"
      - "vendor/pawprint-dns/**"
      - "vendor/pawprint-dns.manifest.json"
      - "package*.json"
      - ".node-version"
      - ".github/workflows/**"
      - "azuredeploy.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bicep-contract:
    # The reusable workflow declares id-token: write, so the caller must grant it
    # or the run fails before any job starts.
    permissions:
      contents: read
      id-token: write
    uses: ninjapaw/pawprint/.github/workflows/kit-bicep-validate.yml@805cae1d739b7bbab1f9733d249372a4b29f66e4
    with:
      bicep-glob: "infra/**/*.bicep"
      check-committed-arm: true
      fail-on-lint-warning: true

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/pawton-manufacturing/package-lock.json

      - name: Install test dependencies
        run: |
          npm ci
          npm ci --prefix apps/pawton-manufacturing

      - name: Validate repository and portal
        run: |
          npm run vendor:check:dns
          bash scripts/test.sh --skip-azure
          npm test --prefix apps/pawton-manufacturing
          npm run build --prefix apps/pawton-manufacturing

      - name: Package verified Linux website
        run: |
          set -euo pipefail
          npm prune --omit=dev --prefix apps/pawton-manufacturing
          (
            cd apps/pawton-manufacturing
            zip -rq "$RUNNER_TEMP/pawton-app.zip" . -x '.astro/*' '.env' '.env.*' '.npmrc'
          )
          unzip -Z1 "$RUNNER_TEMP/pawton-app.zip" > "$RUNNER_TEMP/pawton-entries.txt"
          for path in package.json package-lock.json dist/server/entry.mjs src/layouts/Layout.astro; do
            grep -Fx "$path" "$RUNNER_TEMP/pawton-entries.txt" || {
              echo "::error::Website package is missing $path."
              exit 1
            }
          done

      - name: Retain verified website package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pawton-site-${{ github.sha }}
          path: ${{ runner.temp }}/pawton-app.zip
          if-no-files-found: error
          retention-days: 1
